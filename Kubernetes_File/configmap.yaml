apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-env
data:
  APP_NAME: "PracticeApp"
  APP_ENV: "dev"
  APP_VERSION: "1.0.0"
  WELCOME_MESSAGE: "Welcome to Kubernetes Practice!"
  THEME: "light"
  TIMEZONE: "UTC"
  LOG_LEVEL: "debug"
  FEATURE_LOGIN: "true"
  FEATURE_SIGNUP: "true"
  FEATURE_PAYMENT: "false"
  CACHE_ENABLED: "true"
  MAX_USERS: "1000"
  REGION: "us-east-1"
  SUPPORT_EMAIL: "support@example.com"
  COMPANY_NAME: "DemoCorp"
