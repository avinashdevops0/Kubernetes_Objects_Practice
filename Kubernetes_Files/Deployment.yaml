apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-1
spec:
  replicas: 1
  selector:
    matchLables:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: cont-1
        image: avinashg0/secret
        ports:
         - containerPort: 3000
      envFrom:
      - configMapRef:
          name: configmap-env
      - secretRef:
          name: secret-env